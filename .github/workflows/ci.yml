
name: FlowDesk CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowdesk_test
          POSTGRES_USER: flowdesk_app
          POSTGRES_PASSWORD: flowdesk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flowdesk_app -d flowdesk_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/flowdesk_test
      DB_TEST_URL: jdbc:postgresql://localhost:5432/flowdesk_test
      DB_USERNAME: flowdesk_app
      DB_PASSWORD: flowdesk_ci_password
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run backend tests
        working-directory: backend
        run: mvn clean test

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: 'http://localhost:8080'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  e2e-live:
    name: Real-Stack E2E Acceptance
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowdesk_e2e
          POSTGRES_USER: flowdesk_app
          POSTGRES_PASSWORD: flowdesk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flowdesk_app -d flowdesk_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/flowdesk_e2e
      DB_USERNAME: flowdesk_app
      DB_PASSWORD: flowdesk_ci_password
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      FLOWDESK_FRONTEND_ORIGIN: http://127.0.0.1:3000
      FLOWDESK_MAIL_ENABLED: "false"
      ATTACHMENT_STORAGE_DIR: /tmp/flowdesk_e2e_attachments
      FLOWDESK_BOOTSTRAP_ADMIN_ENABLED: "true"
      FLOWDESK_BOOTSTRAP_ADMIN_EMAIL: admin@flowdesk.test
      FLOWDESK_BOOTSTRAP_ADMIN_PASSWORD: AdminTestPassword123!
      FLOWDESK_BOOTSTRAP_ADMIN_FIRST_NAME: System
      FLOWDESK_BOOTSTRAP_ADMIN_LAST_NAME: Administrator
      RATE_LIMIT_LOGIN_IP_EMAIL_MAX: "100"
      RATE_LIMIT_LOGIN_IP_MAX: "100"
      LIVE_BACKEND_URL: http://127.0.0.1:8080
      LIVE_FRONTEND_URL: http://127.0.0.1:3000
      CI: "true"
      STRICT_LIVE_E2E: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Package backend jar
        working-directory: backend
        run: mvn package -DskipTests

      - name: Bootstrap admin account and apply migrations
        working-directory: backend
        env:
          FLOWDESK_BOOTSTRAP_ADMIN_ENABLED: "true"
          FLOWDESK_BOOTSTRAP_ADMIN_EMAIL: admin@flowdesk.test
          FLOWDESK_BOOTSTRAP_ADMIN_PASSWORD: AdminTestPassword123!
        run: |
          mkdir -p /tmp/flowdesk_e2e_attachments
          java -jar target/backend-0.0.1-SNAPSHOT.jar --flowdesk.bootstrap.admin

      - name: Start backend web instance
        working-directory: backend
        env:
          FLOWDESK_BOOTSTRAP_ADMIN_ENABLED: "false"
        run: |
          java -jar target/backend-0.0.1-SNAPSHOT.jar &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8080/api/health | grep -q "Backend is running"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          if ! curl -s http://127.0.0.1:8080/api/health | grep -q "Backend is running"; then
            echo "Backend failed to become healthy within 120s!"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for live E2E
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend server and run real-stack E2E tests
        working-directory: frontend
        env:
          LIVE_BACKEND_URL: http://127.0.0.1:8080
          LIVE_FRONTEND_URL: http://127.0.0.1:3000
        run: |
          npx vite preview --host 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 1
          done
          if ! curl -s http://127.0.0.1:3000/ > /dev/null; then
            echo "Frontend failed to start within 30s!"
            exit 1
          fi
          npm run test:e2e:live

      - name: Upload Playwright Live report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-report
          path: frontend/playwright-live-report/
          retention-days: 7
