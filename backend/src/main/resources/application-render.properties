# ==============================================================================
# FlowDesk Render Free Deployment Profile Configuration
# Activated via: -Dspring.profiles.active=render or SPRING_PROFILES_ACTIVE=render
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Server Runtime & Dynamic Port Handling
# Render assigns a dynamic port via $PORT (e.g. 10000).
# ------------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Strict error responses (prevent internal exception leakage)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ------------------------------------------------------------------------------
# 2. Ingress & Trusted Reverse Proxy Handling
# Render terminates TLS at the edge and proxies requests with X-Forwarded-* headers.
# ------------------------------------------------------------------------------
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|::1|0:0:0:0:0:0:0:1

# Enable trusted proxy header inspection on all application rate limiters
app.security.rate-limit.login.enabled=${RATE_LIMIT_LOGIN_ENABLED:true}
app.security.rate-limit.login.trust-proxy-headers=${RATE_LIMIT_LOGIN_TRUST_PROXY:true}
app.security.rate-limit.forgot-password.enabled=${RATE_LIMIT_FORGOT_PASSWORD_ENABLED:true}
app.security.rate-limit.forgot-password.trust-proxy-headers=${RATE_LIMIT_FORGOT_PASSWORD_TRUST_PROXY:true}
app.security.rate-limit.invitation.enabled=${RATE_LIMIT_INVITATION_ENABLED:true}
app.security.rate-limit.invitation.trust-proxy-headers=${RATE_LIMIT_INVITATION_TRUST_PROXY:true}
app.security.rate-limit.oauth.enabled=${RATE_LIMIT_OAUTH_ENABLED:true}
app.security.rate-limit.oauth.trust-proxy-headers=${RATE_LIMIT_OAUTH_TRUST_PROXY:true}

# ------------------------------------------------------------------------------
# 3. Database Connection & Memory-Tuned Connection Pool (HikariCP)
# Compatible with Neon Serverless PostgreSQL (TLS) or Render PostgreSQL.
# Container has a strict 512 MB RAM limit.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD}

# Conservative pool sizing: max 4 connections to minimize memory overhead
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:600000}

# Enforce strict Hibernate schema validation (Flyway manages migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# 4. Authentication, Tokens & Cross-Site Refresh Sessions
# On Render, frontend and backend reside on separate subdomains (*.onrender.com).
# Modern browsers require SameSite=None and Secure=true for cross-site cookie transmission.
# ------------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:flowdesk}
app.security.jwt.access-token-ttl=${ACCESS_TOKEN_TTL:PT15M}

app.security.jwt.refresh-token.same-site=${REFRESH_TOKEN_COOKIE_SAMESITE:None}
app.security.jwt.refresh-token.cookie-secure=${REFRESH_TOKEN_COOKIE_SECURE:true}
app.security.jwt.refresh-token.cookie-name=flowdesk_refresh_token
app.security.jwt.refresh-token.cookie-path=/api/auth
app.security.jwt.refresh-token.idle-duration-seconds=${REFRESH_TOKEN_IDLE_SECONDS:604800}
app.security.jwt.refresh-token.max-lifetime-seconds=${REFRESH_TOKEN_MAX_LIFETIME_SECONDS:2592000}
app.security.jwt.refresh-token.grace-period-seconds=${REFRESH_TOKEN_GRACE_PERIOD_SECONDS:30}

# ------------------------------------------------------------------------------
# 5. CORS Whitelist & Frontend Origin
# Must match the public Render Static Site URL (e.g. https://flowdesk-demo.onrender.com)
# ------------------------------------------------------------------------------
app.cors.allowed-origin=${FRONTEND_ORIGIN}
app.security.password-reset.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}
app.security.invitation.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}

# ------------------------------------------------------------------------------
# 6. Attachment Security Guard (Fail-Closed Upload Block)
# In Render Free, persistent volumes and ClamAV (>1.2GB RAM) are unavailable.
# ClamAV fail-closed security is strictly maintained: uploads are explicitly disabled
# and return HTTP 503 rather than bypassing scanning or using mock scanners.
# ------------------------------------------------------------------------------
app.storage.attachment.upload-enabled=false
app.attachment.malware-scanner.enabled=false

# ------------------------------------------------------------------------------
# 7. Actuator & Observability Lockdown
# In Render, web service ports are directly exposed to the public internet.
# Prometheus, metrics, and internal inspection endpoints are disabled.
# Only the public health probe (/api/health and /actuator/health) is permitted.
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=false
management.prometheus.metrics.export.enabled=false

# ------------------------------------------------------------------------------
# 8. Outbound Email Infrastructure (Blocked on Render Free)
# Render Free blocks ALL outbound SMTP ports (25, 465, and 587) by platform policy.
# Direct SMTP email delivery is not possible on Render Free.
# Email subsystem is strictly disabled (FLOWDESK_MAIL_ENABLED=false) for demo.
# Note: For production email delivery, use an HTTP REST API provider (e.g. Resend /
# SendGrid Web API via HTTPS 443) or deploy to OCI production where SMTP is routed.
# ------------------------------------------------------------------------------
app.mail.enabled=false
app.mail.host=localhost
app.mail.port=587
app.mail.from-address=noreply@flowdesk.demo
app.mail.from-name=FlowDesk Demo
app.mail.production=true
app.security.password-reset.production=true
app.security.invitation.production=true

# ------------------------------------------------------------------------------
# 9. Optional Integrations (Gemini AI & Google OAuth)
# ------------------------------------------------------------------------------
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
app.ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}

app.security.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# ------------------------------------------------------------------------------
# 10. First Admin Bootstrap (Web Service In-Process Mode)
# When enabled, provisions the initial admin once, clears credentials in memory,
# and continues web service execution without terminating the JVM.
# ------------------------------------------------------------------------------
app.bootstrap.admin.enabled=${FLOWDESK_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${FLOWDESK_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${FLOWDESK_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${FLOWDESK_BOOTSTRAP_ADMIN_FIRST_NAME:Demo}
app.bootstrap.admin.last-name=${FLOWDESK_BOOTSTRAP_ADMIN_LAST_NAME:Admin}

# ------------------------------------------------------------------------------
# 11. Minimal Logging (Conserve container RAM)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.flowdesk=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Test fixture provisioning - strictly disabled in production
flowdesk.test.fixtures.enabled=false
