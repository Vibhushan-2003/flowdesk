# FlowDesk Production Profile Configuration
# Activated with: -Dspring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)

# Enforce production validation across security and mail subsystems
app.mail.production=true
app.security.password-reset.production=true
app.security.invitation.production=true

# Disable verbose SQL printing in production (can be temporarily enabled via SPRING_JPA_SHOW_SQL=true for targeted debugging)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Production HikariCP Connection Pool defaults
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# Production CORS and Frontend Origin (requires explicit HTTPS URL)
app.cors.allowed-origin=${FRONTEND_ORIGIN:}
app.security.password-reset.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}
app.security.invitation.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}

# Fail-safe error responses (never leak stack traces or internal exception details)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Production logging levels
logging.level.root=INFO
logging.level.com.flowdesk=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
