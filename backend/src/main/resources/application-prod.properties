# ==============================================================================
# FlowDesk Production Profile Configuration
# Activated via: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Database Connection & Connection Pool (HikariCP)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD}

# Conservative HikariCP sizing for 2 OCPU / 12 GB RAM single-VM topology
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# Enforce strict Hibernate schema validation (never auto-generate DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# 2. Authentication, Tokens & Refresh Sessions
# ------------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:flowdesk}
app.security.jwt.access-token-ttl=${ACCESS_TOKEN_TTL:PT15M}

app.security.refresh-token.access-token-duration-seconds=${ACCESS_TOKEN_DURATION_SECONDS:900}
app.security.refresh-token.idle-duration-seconds=${REFRESH_TOKEN_IDLE_SECONDS:604800}
app.security.refresh-token.max-lifetime-seconds=${REFRESH_TOKEN_MAX_LIFETIME_SECONDS:2592000}
app.security.refresh-token.grace-period-seconds=${REFRESH_TOKEN_GRACE_PERIOD_SECONDS:30}

# Production enforcement flags
app.security.password-reset.production=true
app.security.invitation.production=true
app.mail.production=true

# ------------------------------------------------------------------------------
# 3. Ingress, Reverse Proxy & Client IP Resolution
# ------------------------------------------------------------------------------
# Use native Tomcat RemoteIpValve for trusted forwarded-headers handling
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TOMCAT_INTERNAL_PROXIES:127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|::1|0:0:0:0:0:0:0:1}

# Enable trusted proxy header inspection on all application rate limiters
app.security.rate-limit.login.enabled=${RATE_LIMIT_LOGIN_ENABLED:true}
app.security.rate-limit.login.trust-proxy-headers=${RATE_LIMIT_LOGIN_TRUST_PROXY:true}
app.security.rate-limit.login.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
app.security.rate-limit.forgot-password.enabled=${RATE_LIMIT_FORGOT_PASSWORD_ENABLED:true}
app.security.rate-limit.forgot-password.trust-proxy-headers=${RATE_LIMIT_FORGOT_PASSWORD_TRUST_PROXY:true}
app.security.rate-limit.forgot-password.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
app.security.rate-limit.invitation.enabled=${RATE_LIMIT_INVITATION_ENABLED:true}
app.security.rate-limit.invitation.trust-proxy-headers=${RATE_LIMIT_INVITATION_TRUST_PROXY:true}
app.security.rate-limit.invitation.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
app.security.rate-limit.oauth.enabled=${RATE_LIMIT_OAUTH_ENABLED:true}
app.security.rate-limit.oauth.trust-proxy-headers=${RATE_LIMIT_OAUTH_TRUST_PROXY:true}
app.security.rate-limit.oauth.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# ------------------------------------------------------------------------------
# 4. CORS & Frontend Origin Whitelist (Must be explicit HTTPS in production)
# ------------------------------------------------------------------------------
app.cors.allowed-origin=${FRONTEND_ORIGIN}
app.security.password-reset.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}
app.security.invitation.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin}}

# ------------------------------------------------------------------------------
# 5. Outbound Transactional Email (External SMTP over Port 587 STARTTLS)
# ------------------------------------------------------------------------------
app.mail.enabled=${FLOWDESK_MAIL_ENABLED:true}
app.mail.host=${SMTP_HOST:localhost}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.auth=${SMTP_AUTH:true}
app.mail.starttls=${SMTP_STARTTLS:true}
app.mail.ssl=${SMTP_SSL:false}
app.mail.connection-timeout-ms=${SMTP_CONNECTION_TIMEOUT_MS:5000}
app.mail.timeout-ms=${SMTP_TIMEOUT_MS:10000}
app.mail.write-timeout-ms=${SMTP_WRITE_TIMEOUT_MS:10000}
app.mail.from-address=${FLOWDESK_MAIL_FROM_ADDRESS:noreply@flowdesk.example.com}
app.mail.from-name=${FLOWDESK_MAIL_FROM_NAME:FlowDesk}

# ------------------------------------------------------------------------------
# 6. Attachment Storage & Malware Scanning (ClamAV Strict Fail-Closed)
# ------------------------------------------------------------------------------
app.storage.attachment.local.base-directory=${ATTACHMENT_STORAGE_DIR:/app/data/attachments}
app.storage.attachment.max-file-size-bytes=${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
app.storage.attachment.max-attachments-per-ticket=${ATTACHMENT_MAX_PER_TICKET:10}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FLOWDESK_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FLOWDESK_MULTIPART_MAX_REQUEST_SIZE:15MB}

app.attachment.malware-scanner.enabled=true
app.attachment.malware-scanner.type=clamav
app.attachment.malware-scanner.clamav.host=${CLAMAV_HOST:clamav}
app.attachment.malware-scanner.clamav.port=${CLAMAV_PORT:3310}
app.attachment.malware-scanner.clamav.connection-timeout-ms=${CLAMAV_CONNECTION_TIMEOUT_MS:3000}
app.attachment.malware-scanner.clamav.read-timeout-ms=${CLAMAV_READ_TIMEOUT_MS:15000}

# ------------------------------------------------------------------------------
# 7. Optional Integrations (Gemini AI & Google OAuth)
# ------------------------------------------------------------------------------
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
app.ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}

app.security.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# Dormant bootstrap for long-running web application
app.bootstrap.admin.enabled=${FLOWDESK_BOOTSTRAP_ADMIN_ENABLED:false}

# ------------------------------------------------------------------------------
# 8. Server Runtime, Error Disclosure & Process Lifecycle
# ------------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Strict fail-safe error responses (zero stack trace or exception leakage)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Production logging levels (suppress verbose ORM SQL binding output)
logging.level.root=INFO
logging.level.com.flowdesk=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Day 67 - SRE Observability: Spring Boot Actuator & Micrometer Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=flowdesk
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,500ms,1500ms
