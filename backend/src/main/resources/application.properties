spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=flowdesk
app.security.jwt.access-token-ttl=PT15M

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1
app.ai.gemini.connect-timeout-ms=5000
app.ai.gemini.read-timeout-ms=30000


logging.pattern.level=%5p [requestId=%X{requestId:-none}]

# Day 47 - First-ADMIN Bootstrap (disabled by default, requires explicit credentials)
app.bootstrap.admin.enabled=${FLOWDESK_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${FLOWDESK_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${FLOWDESK_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${FLOWDESK_BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${FLOWDESK_BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
