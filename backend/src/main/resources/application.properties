spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=flowdesk
app.security.jwt.access-token-ttl=PT15M

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1
app.ai.gemini.connect-timeout-ms=5000
app.ai.gemini.read-timeout-ms=30000