spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=flowdesk
app.security.jwt.access-token-ttl=PT15M

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1
app.ai.gemini.connect-timeout-ms=5000
app.ai.gemini.read-timeout-ms=30000


logging.pattern.level=%5p [requestId=%X{requestId:-none}]

# Day 47 - First-ADMIN Bootstrap (disabled by default, requires explicit credentials)
app.bootstrap.admin.enabled=${FLOWDESK_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${FLOWDESK_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${FLOWDESK_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${FLOWDESK_BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${FLOWDESK_BOOTSTRAP_ADMIN_LAST_NAME:Administrator}

# Day 48 - Login Rate Limiting (in-memory dual quota: client IP + normalized email)
app.security.rate-limit.login.enabled=${RATE_LIMIT_LOGIN_ENABLED:true}
app.security.rate-limit.login.ip-max-attempts=${RATE_LIMIT_LOGIN_IP_MAX:30}
app.security.rate-limit.login.ip-window-seconds=${RATE_LIMIT_LOGIN_IP_WINDOW:60}
app.security.rate-limit.login.ip-email-max-attempts=${RATE_LIMIT_LOGIN_IP_EMAIL_MAX:5}
app.security.rate-limit.login.ip-email-window-seconds=${RATE_LIMIT_LOGIN_IP_EMAIL_WINDOW:300}
app.security.rate-limit.login.max-tracked-keys=${RATE_LIMIT_LOGIN_MAX_TRACKED_KEYS:10000}
app.security.rate-limit.login.max-body-bytes=${RATE_LIMIT_LOGIN_MAX_BODY_BYTES:8192}
app.security.rate-limit.login.trust-proxy-headers=${RATE_LIMIT_LOGIN_TRUST_PROXY:false}

# Day 49 Phase 2A - Outbound Email Infrastructure
app.mail.enabled=${FLOWDESK_MAIL_ENABLED:true}
app.mail.host=${SMTP_HOST:localhost}
app.mail.port=${SMTP_PORT:1025}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.auth=${SMTP_AUTH:false}
app.mail.starttls=${SMTP_STARTTLS:false}
app.mail.ssl=${SMTP_SSL:false}
app.mail.connection-timeout-ms=${SMTP_CONNECTION_TIMEOUT_MS:5000}
app.mail.timeout-ms=${SMTP_TIMEOUT_MS:5000}
app.mail.write-timeout-ms=${SMTP_WRITE_TIMEOUT_MS:5000}
app.mail.from-address=${FLOWDESK_MAIL_FROM_ADDRESS:noreply@flowdesk.internal}
app.mail.from-name=${FLOWDESK_MAIL_FROM_NAME:FlowDesk}
app.mail.production=${FLOWDESK_MAIL_PRODUCTION:false}

# Day 49 Phase 2B - Password Recovery Configuration
app.security.password-reset.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin:http://localhost:5173}}
app.security.password-reset.token-validity-minutes=${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:15}
app.security.password-reset.token-entropy-bytes=${PASSWORD_RESET_TOKEN_ENTROPY_BYTES:32}
app.security.password-reset.production=${FLOWDESK_MAIL_PRODUCTION:false}

# Day 49 Phase 2B - Password Reset Rate Limiting (independent from login rate limiter)
app.security.rate-limit.forgot-password.enabled=${RATE_LIMIT_FORGOT_PASSWORD_ENABLED:true}
app.security.rate-limit.forgot-password.ip-max-attempts=${RATE_LIMIT_FORGOT_PASSWORD_IP_MAX:10}
app.security.rate-limit.forgot-password.ip-window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_IP_WINDOW:60}
app.security.rate-limit.forgot-password.ip-email-max-attempts=${RATE_LIMIT_FORGOT_PASSWORD_IP_EMAIL_MAX:3}
app.security.rate-limit.forgot-password.ip-email-window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_IP_EMAIL_WINDOW:300}
app.security.rate-limit.forgot-password.reset-password-ip-max-attempts=${RATE_LIMIT_RESET_PASSWORD_IP_MAX:15}
app.security.rate-limit.forgot-password.reset-password-ip-window-seconds=${RATE_LIMIT_RESET_PASSWORD_IP_WINDOW:60}
app.security.rate-limit.forgot-password.max-tracked-keys=${RATE_LIMIT_FORGOT_PASSWORD_MAX_KEYS:10000}
app.security.rate-limit.forgot-password.max-body-bytes=${RATE_LIMIT_FORGOT_PASSWORD_MAX_BYTES:4096}
app.security.rate-limit.forgot-password.trust-proxy-headers=${RATE_LIMIT_FORGOT_PASSWORD_TRUST_PROXY:false}

# Day 49 Phase 2B - Password Reset Token Cleanup Scheduler
app.security.password-reset.cleanup.fixed-delay-ms=${PASSWORD_RESET_CLEANUP_FIXED_DELAY_MS:3600000}
app.security.password-reset.cleanup.initial-delay-ms=${PASSWORD_RESET_CLEANUP_INITIAL_DELAY_MS:60000}

# Day 50 - Admin User Invitation Configuration
app.security.invitation.frontend-origin=${FLOWDESK_FRONTEND_ORIGIN:${app.cors.allowed-origin:http://localhost:5173}}
app.security.invitation.token-validity-hours=${INVITATION_TOKEN_VALIDITY_HOURS:48}
app.security.invitation.token-entropy-bytes=${INVITATION_TOKEN_ENTROPY_BYTES:32}
app.security.invitation.cleanup.fixed-delay-ms=${INVITATION_CLEANUP_FIXED_DELAY_MS:3600000}
app.security.invitation.cleanup.initial-delay-ms=${INVITATION_CLEANUP_INITIAL_DELAY_MS:120000}

# Day 50 - Invitation Acceptance Rate Limiting
app.security.rate-limit.invitation.enabled=${RATE_LIMIT_INVITATION_ENABLED:true}
app.security.rate-limit.invitation.accept-ip-max-attempts=${RATE_LIMIT_INVITATION_ACCEPT_IP_MAX:15}
app.security.rate-limit.invitation.accept-ip-window-seconds=${RATE_LIMIT_INVITATION_ACCEPT_IP_WINDOW:60}
app.security.rate-limit.invitation.max-tracked-keys=${RATE_LIMIT_INVITATION_MAX_KEYS:10000}
app.security.rate-limit.invitation.max-body-bytes=${RATE_LIMIT_INVITATION_MAX_BYTES:4096}
app.security.rate-limit.invitation.trust-proxy-headers=${RATE_LIMIT_INVITATION_TRUST_PROXY:false}

# Day 50 - Google OAuth & Account Linking Rate Limiting
app.security.rate-limit.oauth.enabled=${RATE_LIMIT_OAUTH_ENABLED:true}
app.security.rate-limit.oauth.ip-max-attempts=${RATE_LIMIT_OAUTH_IP_MAX:30}
app.security.rate-limit.oauth.ip-window-seconds=${RATE_LIMIT_OAUTH_IP_WINDOW:60}
app.security.rate-limit.oauth.max-tracked-keys=${RATE_LIMIT_OAUTH_MAX_KEYS:10000}
app.security.rate-limit.oauth.max-body-bytes=${RATE_LIMIT_OAUTH_MAX_BYTES:8192}
app.security.rate-limit.oauth.trust-proxy-headers=${RATE_LIMIT_OAUTH_TRUST_PROXY:false}

# Google OAuth 2.0 / OpenID Connect Configuration
app.security.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}
app.security.oauth2.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
app.security.oauth2.google.connect-timeout-ms=5000
app.security.oauth2.google.read-timeout-ms=10000

# Day 51 - Secure Ticket Attachment Foundation
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FLOWDESK_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FLOWDESK_MULTIPART_MAX_REQUEST_SIZE:15MB}

app.storage.attachment.local.base-directory=${ATTACHMENT_STORAGE_DIR:data/attachments}
app.storage.attachment.max-file-size-bytes=${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
app.storage.attachment.max-attachments-per-ticket=${ATTACHMENT_MAX_PER_TICKET:10}
