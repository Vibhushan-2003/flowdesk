
# Day 39 - Limit test-only database connection usage.
# Multiple Spring Boot test contexts can create separate Hikari pools.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Day 49 - Do not execute migrations against the developer's active database during local tests.
# CI environments (where CI=true) execute migrations on an isolated ephemeral test database.
spring.flyway.enabled=${FLYWAY_TEST_ENABLED:${CI:false}}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
