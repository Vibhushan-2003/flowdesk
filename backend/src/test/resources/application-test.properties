# Day 52 - Early context initializer for database safety guard
context.initializer.classes=com.flowdesk.common.test.TestDatabaseSafetyInitializer

# Day 52 - Strong Integration Test Isolation
# Test database defaults to flowdesk_test on localhost.
# Credentials and URL can be customized via environment variables:
#   DB_TEST_URL, DB_TEST_USERNAME, DB_TEST_PASSWORD
# Falling back to DB_USERNAME and DB_PASSWORD if not specified.
spring.datasource.url=${DB_TEST_URL:jdbc:postgresql://localhost:5432/flowdesk_test}
spring.datasource.username=${DB_TEST_USERNAME:${DB_USERNAME:flowdesk_app}}
spring.datasource.password=${DB_TEST_PASSWORD:${DB_PASSWORD:12345678}}

# Enable Flyway migrations on the test database so schema is initialized cleanly
spring.flyway.enabled=${FLYWAY_TEST_ENABLED:true}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# Day 39 - Limit test-only database connection usage.
# Multiple Spring Boot test contexts can create separate Hikari pools.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Day 49 Phase 2A - Suppress real SMTP network connections during automated tests
app.mail.enabled=false
