# ==============================================================================
# FlowDesk Production Prometheus Configuration
# ==============================================================================
# Scrapes internal Spring Boot Actuator Micrometer endpoint (/actuator/prometheus)
# over private Docker bridge network. No external access.
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "flowdesk-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "flowdesk"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
